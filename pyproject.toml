[project]
name = "retrieval-playbook"
version = "0.1.0"
description = "Hybrid retrieval methods from production, runnable and measured on public data"
readme = "README.md"
authors = [
    { name = "Nguyễn Thành Long", email = "long.itptit@gmail.com" }
]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2",
    "qdrant-client>=1.20",
    "fastembed>=0.8",
    "sentence-transformers>=5.0.0",
    "transformers>=4.57.0",
    "torch>=2.8.0",
    "peft>=0.15.2",
]

[project.optional-dependencies]
eval = ["datasets>=3"]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs models, network or a Qdrant server"]
addopts = "-m 'not integration'"
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# CPU-only torch on Linux keeps the Docker image small; macOS uses the default wheels.
[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
